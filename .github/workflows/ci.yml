name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/consolidar-extractos/scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r skills/consolidar-extractos/scripts/requirements.txt
      - name: Syntax check
        run: python -m compileall -q skills/consolidar-extractos/scripts
      - name: End-to-end test (synthetic data)
        run: python skills/consolidar-extractos/tests/test_flujo.py
